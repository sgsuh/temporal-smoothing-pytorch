services:
  dev:
    build: .
    image: temporal-smoothing-pytorch:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /workspace
    environment:
      CAMVID_ROOT: /data/CamVid
    volumes:
      - .:/workspace
      - ${DATA_ROOT:-./datasets}:/data
    shm_size: 8gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
